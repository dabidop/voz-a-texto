name: Crear instalador de Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear instalador
        run: npm run dist

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Voz-a-texto-Windows
          path: release/Voz-a-texto-Setup.exe
